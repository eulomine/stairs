<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>무한의 계단 – 교회 에디션 (Online)</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',sans-serif;background:#000;touch-action:none;user-select:none;}
#loadScreen{position:fixed;inset:0;z-index:9999;background:#0a0520;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:18px;transition:opacity .5s;}
#loadScreen.hidden{opacity:0;pointer-events:none;}
#loadBar{width:60%;height:14px;background:#222;border-radius:7px;margin-top:16px;overflow:hidden;}
#loadFill{width:0%;height:100%;background:linear-gradient(90deg,#ffd740,#ff9800);border-radius:7px;transition:width .2s;}
#loadText{margin-top:10px;font-size:13px;color:#aaa;}
#titleScreen{position:fixed;inset:0;z-index:100;background:linear-gradient(180deg,#0a0520 0%,#1a0a3e 50%,#2d1b69 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
#titleScreen.hidden{display:none;}
.title-main{font-size:32px;font-weight:900;text-shadow:0 0 20px rgba(255,215,64,.6);margin-bottom:6px;text-align:center;}
.title-sub{font-size:14px;color:#ccc;margin-bottom:24px;}
.title-btn{display:block;width:220px;padding:14px;margin:6px auto;border:2px solid #ffd740;border-radius:12px;background:rgba(255,215,64,.12);color:#ffd740;font-size:16px;font-weight:700;cursor:pointer;text-align:center;}
.title-btn:active{background:rgba(255,215,64,.3);}
.char-select{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:18px 0;}
.char-btn{width:90px;padding:10px 4px;border:2px solid #555;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:12px;cursor:pointer;text-align:center;}
.char-btn img{width:48px;height:60px;image-rendering:pixelated;display:block;margin:0 auto 4px;}
.char-btn.selected{border-color:#ffd740;background:rgba(255,215,64,.15);}
#game-view{position:fixed;inset:0;display:none;z-index:10;}
#game-view.active{display:block;}
.bg-layer{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background-color:#0a0520;background-size:cover;background-position:center;background-repeat:no-repeat;transition:opacity 1s ease-in-out;}
#bgA{opacity:1;z-index:0;}
#bgB{opacity:0;z-index:0;}
#cloudOverlay{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s ease-in-out;background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.7) 20%, rgba(255,255,255,.95) 40%, rgba(255,255,255,.95) 60%, rgba(255,255,255,.7) 80%, rgba(255,255,255,0) 100%);}
#cloudOverlay.active{opacity:1;}
#world{position:absolute;top:0;left:0;width:100%;height:100%;z-index:3;transition:transform .12s ease-out;}
.step{position:absolute;image-rendering:pixelated;}
.step-normal{background:#8B5E3C;border-top:3px solid #A97C50;border-left:2px solid #A97C50;border-right:2px solid #6B4226;border-bottom:2px solid #5C3A1E;}
.step-ice{background:#88ccee;border-top:3px solid #aaeeff;border-left:2px solid #aaeeff;border-right:2px solid #66aabb;border-bottom:2px solid #5599aa;}
.step-fire{background:#cc4400;border-top:3px solid #ff6622;border-left:2px solid #ff6622;border-right:2px solid #aa3300;border-bottom:2px solid #882200;}
.step-dark{background:#333;border-top:3px solid #555;border-left:2px solid #555;border-right:2px solid #222;border-bottom:2px solid #111;}
.step-gold{background:#ffd740;border-top:3px solid #ffe082;border-left:2px solid #ffe082;border-right:2px solid #ffc107;border-bottom:2px solid #f9a825;}
#player{position:fixed;z-index:5;image-rendering:pixelated;pointer-events:none;transition:transform .08s;}
#hud{position:fixed;top:8px;left:8px;right:8px;z-index:50;display:none;color:#fff;font-size:14px;}
#hud.active{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;}
.hud-item{background:rgba(0,0,0,.5);padding:4px 10px;border-radius:8px;font-weight:700;}
#progressWrap{width:100%;height:10px;background:rgba(255,255,255,.15);border-radius:5px;margin-top:6px;overflow:hidden;display:none;}
#progressFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd740,#ff9800);border-radius:5px;transition:width .3s;}
#bgLabel{position:fixed;top:42px;left:50%;transform:translateX(-50%);z-index:50;color:#ffd740;font-size:13px;font-weight:700;text-shadow:0 0 8px rgba(0,0,0,.7);opacity:0;transition:opacity .5s;}
#buttons{position:fixed;bottom:0;left:0;right:0;height:130px;z-index:60;display:none;gap:0;}
#buttons.active{display:flex;}
.btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border:none;font-size:18px;font-weight:700;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent;}
.btn-turn{background:rgba(30,30,80,.85);border-right:1px solid rgba(255,255,255,.1);}
.btn-forward{background:rgba(80,30,30,.85);}
.btn:active{filter:brightness(1.4);}
.btn-icon{font-size:26px;margin-bottom:4px;}
#storyPopup{position:fixed;top:15%;left:50%;transform:translateX(-50%);z-index:70;background:rgba(0,0,0,.75);color:#fff;padding:16px 18px;border-radius:14px;border:1px solid rgba(255,215,64,.4);max-width:300px;text-align:center;font-size:14px;line-height:1.5;pointer-events:none;opacity:0;transition:opacity .6s ease-in-out;}
#storyPopup.show{opacity:1;}
#storyPopup .verse{color:#ffd740;font-size:11px;margin-top:8px;}
.overlay{position:fixed;inset:0;z-index:300;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);color:#fff;text-align:center;padding:20px;}
.overlay.active{display:flex;}
.ov-title{font-size:28px;font-weight:900;margin-bottom:10px;}
.ov-info{font-size:16px;margin-bottom:6px;}
.ov-input{padding:10px;border-radius:8px;border:2px solid #ffd740;background:#111;color:#fff;font-size:16px;width:200px;margin:10px 0;text-align:center;}
.ov-btn{padding:12px 28px;margin:6px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;}
.ov-btn-save{background:#ffd740;color:#000;}
.ov-btn-restart{background:#4caf50;}
.ov-btn-title{background:#555;}
#rankScreen{position:fixed;inset:0;z-index:400;display:none;flex-direction:column;background:rgba(0,0,0,.92);color:#fff;padding:20px;}
#rankScreen.active{display:flex;}
#rankScreen h2{text-align:center;margin-bottom:12px;color:#ffd740;}
.rank-tabs{display:flex;justify-content:center;gap:8px;margin-bottom:12px;}
.rank-tab{padding:8px 18px;border-radius:8px;border:1px solid #555;background:transparent;color:#ccc;cursor:pointer;font-size:14px;}
.rank-tab.active{background:#ffd740;color:#000;border-color:#ffd740;font-weight:700;}
#rankBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.rank-table{width:100%;border-collapse:collapse;font-size:13px;}
.rank-table th{background:rgba(255,215,64,.15);padding:8px 4px;text-align:center;color:#ffd740;}
.rank-table td{padding:8px 4px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08);}
.rank-close{display:block;margin:12px auto 0;padding:10px 30px;border-radius:10px;border:none;background:#555;color:#fff;font-size:15px;cursor:pointer;}
#comboPopup{position:fixed;top:25%;left:50%;transform:translateX(-50%);z-index:70;color:#ffd740;font-size:24px;font-weight:900;text-shadow:0 0 10px rgba(255,215,64,.6);opacity:0;transition:opacity .3s;pointer-events:none;}
.heaven-gate{position:absolute;width:200px;text-align:center;z-index:4;pointer-events:none;}
.heaven-gate .gate-glow{font-size:48px;animation:pulse 1.5s infinite;}
.heaven-gate .gate-text{color:#ffd740;font-size:16px;font-weight:900;text-shadow:0 0 15px rgba(255,215,64,.8);}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8;}50%{transform:scale(1.15);opacity:1;}}
.my-rank-box{margin-top:14px;padding:12px;border-radius:10px;background:rgba(255,255,255,.06);text-align:center;font-size:14px;border:1px solid rgba(255,215,64,.25);}
.my-rank-box strong{color:#ffd740;font-size:18px;}
</style>
</head>
<body>

<div id="loadScreen">
  <div>리소스 로딩 중...</div>
  <div id="loadBar"><div id="loadFill"></div></div>
  <div id="loadText"></div>
</div>

<div id="titleScreen" class="hidden">
  <div class="title-main">⛪ 무한의 계단</div>
  <div class="title-sub">교회 에디션 (Online)</div>
  <div id="charSelectArea"></div>
  <button class="title-btn" onclick="selectMode('story')">✝️ 믿음의 여정 (150층)</button>
  <button class="title-btn" onclick="selectMode('infinite')">♾️ 무한 모드</button>
  <button class="title-btn" onclick="showRanking()" style="border-color:#2196f3;color:#2196f3;background:rgba(33,150,243,.1);">🏆 순위표</button>
</div>

<div id="game-view">
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>

  <img id="player" src="" alt="">

</div>

<div class="overlay" id="overOverlay">

  <input class="ov-input" id="overName" placeholder="이름 입력" maxlength="12">
  <div>
    <button class="ov-btn ov-btn-save" onclick="saveAndShow(gameMode)">기록 등록</button>
    <button class="ov-btn ov-btn-restart" onclick="restartGame()">🔄 재시작</button>

  </div>
  <div id="rankBody"></div>

<script>
/* ================================================================
   1. Firebase 설정
   ================================================================ */
const firebaseConfig = {
    apiKey: "AIzaSyBNXIu32GPGJjfPlkrZ_WFLsZViMEWJvY4",
    authDomain: "moohan-2380a.firebaseapp.com",
    databaseURL: "https://moohan-2380a-default-rtdb.firebaseio.com",
    projectId: "moohan-2380a",
    storageBucket: "moohan-2380a.appspot.com",
    messagingSenderId: "207937743460",
    appId: "1:207937743460:web:3525258796e32d61b90d71",
    measurementId: "G-D14JN4J921"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ================================================================
   2. 게임 상수 및 데이터
   ================================================================ */
const STEP_W=55,STEP_DY=48,STEP_RENDER_W=80,STEP_RENDER_H=28;
const PLAYER_W=120,PLAYER_H=150,CHAR_VISUAL_OFFSET=20;
const BTN_HEIGHT=130,AHEAD_COUNT=6,INPUT_COOLDOWN=150;

const BG_URLS=['https://i.postimg.cc/sfnhQdQF/1.jpg','https://i.postimg.cc/qBm3hVt5/2.jpg','https://i.postimg.cc/NGNH9qyn/3.jpg','https://i.postimg.cc/zDdgbZL2/4.jpg','https://i.postimg.cc/sfnhQdB0/5.jpg'];
const charDefs={
    pastor:{name:'목사님',idle:'https://i.postimg.cc/NMxfDbBK/idle.png',step:'https://i.postimg.cc/xCPT5gnc/step.png',fall:'https://i.postimg.cc/cHc4hT0K/fall.png'},
    elder:{name:'장로님',idle:'https://i.postimg.cc/g0PXFG5w/jang1.png',step:'https://i.postimg.cc/Xv0GSnhJ/jang2.png',fall:'https://i.postimg.cc/R0z65v80/jang3.png'},
    boy:{name:'신광이',idle:'https://i.postimg.cc/Z5NBMWfW/boy1.png',step:'https://i.postimg.cc/4xc7SY8m/boy2.png',fall:'https://i.postimg.cc/cJNgydjL/boy3.png'},
    girl:{name:'새빛이',idle:'https://i.postimg.cc/nhmjPXdr/girl1.png',step:'https://i.postimg.cc/3xG4ckLy/girl2.png',fall:'https://i.postimg.cc/3wH4536r/girl3.png'}
};
const storyMessages=[
    {floor:1,text:'교회에서 첫 발을 내딛습니다.',verse:'히브리서 11:1'},
    {floor:15,text:'새벽기도의 시간…',verse:'시편 119:105'},
    {floor:30,text:'시련의 바다...',verse:'이사야 43:2'},
    {floor:50,text:'믿음을 지킵니다.',verse:'마태복음 14:31'},
    {floor:145,text:'영광의 문 앞에!',verse:'요한계시록 21:4'}
];

/* ── 상태 변수 ── */
let gameMode='story',selectedChar='pastor',gameActive=false;
let score=0,combo=0,maxCombo=0;
let steps=[],moveDir=1,playerDir=1;
let timerStart=0,timerInterval=null,elapsed=0;
let currentBgIdx=-1,heavenGateEl=null;
let lastInputTime=0,storyPopupTimer=null;
let bgTransitioning=false,activeBgLayer='A';
let lastSavedRankInfo=null; // 온라인용 내 최신 기록 정보

/* ── DOM ── */
const world=document.getElementById('world'), player=document.getElementById('player');
const bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB'), cloudOverlay=document.getElementById('cloudOverlay');
const hudFloor=document.getElementById('hudFloor'), hudTime=document.getElementById('hudTime'), progressFill=document.getElementById('progressFill');

/* ================================================================
   3. 시스템 로직 (이미지, 로딩 등)
   ================================================================ */
const imageCache={};
function cacheImageAsDataURL(url){
    return new Promise(resolve=>{
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{
            try{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); imageCache[url]=c.toDataURL('image/png'); }catch(e){ imageCache[url]=url; }
            resolve();
        };
        img.onerror=()=>{ imageCache[url]=url; resolve(); };
        img.src=url;
    });
}
function cached(url){return imageCache[url]||url;}

async function preloadAllAssets(onProgress,onDone){
    const charUrls=[]; Object.values(charDefs).forEach(c=>{charUrls.push(c.idle,c.step,c.fall);});
    const allUrls=[...charUrls,...BG_URLS];
    const total=allUrls.length; let loaded=0;
    const promises=allUrls.map((url,i)=>{
        return new Promise(resolve=>{
            if(i<charUrls.length){ cacheImageAsDataURL(url).then(()=>{ loaded++; onProgress(loaded,total); resolve(); }); }
            else { const img=new Image(); img.crossOrigin='anonymous'; img.onload=img.onerror=()=>{ loaded++; onProgress(loaded,total); resolve(); }; img.src=url; }
        });
    });
    await Promise.all(promises); onDone();
}

window.addEventListener('load',()=>{
    preloadAllAssets((ld,tot)=>{document.getElementById('loadFill').style.width=Math.round(ld/tot*100)+'%';},()=>{
        setTimeout(()=>{ document.getElementById('loadScreen').classList.add('hidden'); document.getElementById('titleScreen').classList.remove('hidden'); buildCharSelect(); },400);
    });
});

/* ================================================================
   4. 게임 플레이 로직
   ================================================================ */
function buildCharSelect(){
    const area=document.getElementById('charSelectArea'); area.innerHTML='';
    const wrap=document.createElement('div'); wrap.className='char-select';
    Object.entries(charDefs).forEach(([key,def])=>{
        const btn=document.createElement('button'); btn.className='char-btn'+(key===selectedChar?' selected':'');
        btn.innerHTML=`<img src="${cached(def.idle)}"><span>${def.name}</span>`;
        btn.onclick=()=>{ selectedChar=key; wrap.querySelectorAll('.char-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); };
        wrap.appendChild(btn);
    });
    area.appendChild(wrap);
}

function startGame(){
    document.getElementById('titleScreen').classList.add('hidden');
    document.getElementById('game-view').classList.add('active');
    document.getElementById('hud').classList.add('active');
    document.getElementById('buttons').classList.add('active');
    initGameState(); startBGM();
}

function initGameState(){
    gameActive=true; score=0; combo=0; maxCombo=0; moveDir=1; playerDir=1; elapsed=0; currentBgIdx=-1; steps=[];
    world.innerHTML=''; document.getElementById('progressWrap').style.display=(gameMode==='story')?'block':'none';
    const startX=window.innerWidth/2, startY=1000;
    steps.push({x:startX,y:startY,dir:0,type:'normal',floor:0,el:null}); renderStep(steps[0]);
    const total=(gameMode==='story')?150:AHEAD_COUNT+5;
    for(let i=0;i<total;i++)addNewStep();
    if(gameMode==='story')createHeavenGate();
    setPlayerImage('idle');
    player.style.left=(window.innerWidth/2-PLAYER_W/2)+'px';
    player.style.top=(window.innerHeight-BTN_HEIGHT-40-PLAYER_H+CHAR_VISUAL_OFFSET)+'px';
    updateCamera(); updateBg(0); updateHUD();
    if(timerInterval)clearInterval(timerInterval);
    timerStart=Date.now(); timerInterval=setInterval(()=>{ if(!gameActive)return; elapsed=(Date.now()-timerStart)/1000; hudTime.textContent='⏱ '+elapsed.toFixed(1)+'s'; },100);
}

function handleInput(action){
    if(!gameActive)return;
    const now=Date.now(); if(now-lastInputTime<INPUT_COOLDOWN)return; lastInputTime=now;
    const nextIdx=score+1;
    if(nextIdx>=steps.length){ if(gameMode==='story' && score===150)gameClear(); return; }
    const nextStep=steps[nextIdx];
    let inputDir;
    if(action==='turn'){ moveDir*=-1; playerDir=moveDir; inputDir=moveDir; sfxTurn(); }
    else { inputDir=moveDir; sfxJump(); }

    if(inputDir===nextStep.dir){
        score++; combo++; if(combo>maxCombo)maxCombo=combo;
        player.style.transform=`translateX(0) scaleX(${playerDir})`;
        setPlayerImage('step'); updateCamera(); updateBg(score); updateHUD();
        if(gameMode==='infinite'){ while(steps.length-score<AHEAD_COUNT+3)addNewStep(); }
        checkStoryMessage(score);
        if(gameMode==='story' && score===150){ gameActive=false; setTimeout(gameClear,300); return; }
        setTimeout(()=>{ if(gameActive)setPlayerImage('idle'); },80);
    } else { gameOver(); }
}

/* ================================================================
   5. 온라인 랭킹 로직 (Firebase)
   ================================================================ */

// 데이터 저장
function saveScoreOnline(mode, name, floor, time) {
    const scoreRef = db.ref('rankings/' + mode);
    const newEntryRef = scoreRef.push();
    const entryData = {
        name: name || "무명성도",
        floor: parseInt(floor),
        time: parseFloat(time),
        timestamp: Date.now()
    };
    
    // 유니크 ID 저장을 위해
    const entryId = newEntryRef.key;
    newEntryRef.set(entryData);

    // 내 방금 기록 상태 저장 (순위 화면 하단 노출용)
    lastSavedRankInfo = {
        mode: mode,
        id: entryId,
        entry: entryData,
        rank: '?' 
    };
}

// 순위표 렌더링 (상위 10위 + 내 기록)
function renderRank(mode) {
    const body = document.getElementById('rankBody');
    body.innerHTML = '<p style="text-align:center;color:#ffd740;padding:20px;">영광의 기록을 불러오는 중...</p>';

    // 전체 데이터를 층수 기준 내림차순으로 가져옴
    db.ref('rankings/' + mode).orderByChild('floor').once('value', (snapshot) => {
        let allScores = [];
        snapshot.forEach((child) => {
            let data = child.val();
            data.id = child.key;
            allScores.push(data);
        });

        // 1순위: 층(높은순), 2순위: 시간(짧은순)
        allScores.sort((a, b) => b.floor - a.floor || a.time - b.time);

        if (allScores.length === 0) {
            body.innerHTML = '<p style="text-align:center;color:#999;padding:20px;">아직 기록이 없습니다.</p>';
            return;
        }

        // 상위 10명 추출
        const top10 = allScores.slice(0, 10);
        
        let html = '<table class="rank-table"><thead><tr><th>순위</th><th>이름</th><th>층</th><th>시간</th></tr></thead><tbody>';
        top10.forEach((s, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
            const isMine = lastSavedRankInfo && lastSavedRankInfo.id === s.id;
            html += `<tr style="${isMine ? 'background:rgba(255,215,64,.2);font-weight:700;' : ''}">
                <td>${medal}</td>
                <td>${s.name}</td>
                <td>${s.floor}</td>
                <td>${s.time}s</td>
            </tr>`;
        });
        html += '</tbody></table>';

        // 내 최신 기록이 있다면 하단에 별도 표시 (10위 밖이라도 표시)
        if (lastSavedRankInfo && lastSavedRankInfo.mode === mode) {
            // 전체에서 내 순위 찾기
            const myTotalRank = allScores.findIndex(s => s.id === lastSavedRankInfo.id) + 1;
            html += `
                <div class="my-rank-box">
                    방금 나의 기록 (전체 ${myTotalRank}위)<br>
                    <strong>${lastSavedRankInfo.entry.name} 성도님 : ${lastSavedRankInfo.entry.floor}층 (${lastSavedRankInfo.entry.time}s)</strong>
                </div>
            `;
        }

        body.innerHTML = html;
    });
}

function saveAndShow(mode){
    const isClr=document.getElementById('clearOverlay').classList.contains('active');
    const inp=isClr?document.getElementById('clearName'):document.getElementById('overName');
    const name=inp.value.trim()||'무명성도';

    saveScoreOnline(mode, name, score, parseFloat(elapsed.toFixed(1)));

    inp.value='';
    document.getElementById('clearOverlay').classList.remove('active');
    document.getElementById('overOverlay').classList.remove('active');
    showRanking(mode);
}

/* ================================================================
   6. 기타 시스템 (배경, 사운드, 버튼 등)
   ================================================================ */
function showRanking(mode){ gameActive=false; stopBGM(); let m=mode||'story'; document.getElementById('rankScreen').classList.add('active'); switchRankTab(m, document.querySelectorAll('.rank-tab')[m==='story'?0:1]); }
function switchRankTab(mode,btn){ document.querySelectorAll('.rank-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderRank(mode); }
function closeRanking(){ document.getElementById('rankScreen').classList.remove('active'); goTitle(); }
function updateHUD(){ hudFloor.textContent='🏢 '+score+'층'; if(gameMode==='story')progressFill.style.width=Math.min(score/150*100,100)+'%'; }
function updateCamera(){ const cur=steps[score]; if(!cur)return; world.style.transform=`translate(${window.innerWidth/2-cur.x}px,${(window.innerHeight-BTN_HEIGHT-40)-cur.y}px)`; }
function getBgPhase(f){ let p=f/((gameMode==='story')?150:250); if(p<.2)return{idx:0,label:'⛪ 교회'}; if(p<.4)return{idx:1,label:'🌊 시련의 바다'}; if(p<.6)return{idx:2,label:'🏜️ 광야'}; if(p<.8)return{idx:3,label:'🔥 연단의 불'}; return{idx:4,label:'✨ 천국'}; }
function updateBg(f){ 
    const p=getBgPhase(f); if(p.idx!==currentBgIdx){ if(currentBgIdx===-1){ bgA.style.backgroundImage=`url('${BG_URLS[p.idx]}')`; bgA.style.opacity=1; activeBgLayer='A'; } else { transitionBg(p.idx); } currentBgIdx=p.idx; }
    document.getElementById('bgLabel').textContent=p.label; document.getElementById('bgLabel').style.opacity=1; setTimeout(()=>document.getElementById('bgLabel').style.opacity=0,2000);
}
function transitionBg(idx){ if(bgTransitioning)return; bgTransitioning=true; const inc=(activeBgLayer==='A')?bgB:bgA; const out=(activeBgLayer==='A')?bgA:bgB; inc.style.backgroundImage=`url('${BG_URLS[idx]}')`; inc.style.opacity=1; cloudOverlay.classList.add('active'); setTimeout(()=>{ out.style.opacity=0; activeBgLayer=(activeBgLayer==='A')?'B':'A'; cloudOverlay.classList.remove('active'); bgTransitioning=false; },600); }
function addNewStep(){ const prev=steps[steps.length-1]; const dir=Math.random()<.5?-1:1; const s={x:prev.x+dir*STEP_W,y:prev.y-STEP_DY,dir:dir,type:getStepType(steps.length),floor:steps.length,el:null}; steps.push(s); renderStep(s); }
function renderStep(s){ const div=document.createElement('div'); div.className='step step-'+s.type; div.style.width=STEP_RENDER_W+'px'; div.style.height=STEP_RENDER_H+'px'; div.style.left=(s.x-STEP_RENDER_W/2)+'px'; div.style.top=s.y+'px'; world.appendChild(div); s.el=div; }
function getStepType(f){ if(gameMode==='story'){ if(f>130)return 'gold'; if(f>90&&Math.random()<.2)return 'fire'; return 'normal'; } return Math.random()<.1?'ice':'normal'; }
function setPlayerImage(p){ player.src=cached(charDefs[selectedChar][p]); }
function checkStoryMessage(f){ if(gameMode!=='story')return; const m=storyMessages.find(x=>x.floor===f); if(m) showStoryPopup(m.text,m.verse); }
function showStoryPopup(t,v){ document.getElementById('storyText').textContent=t; document.getElementById('storyVerse').textContent=v; storyPopupEl.classList.add('show'); setTimeout(()=>storyPopupEl.classList.remove('show'),3000); }
function gameOver(){ gameActive=false; sfxFail(); stopBGM(); if(timerInterval)clearInterval(timerInterval); setPlayerImage('fall'); player.style.transition='top .6s ease-in'; player.style.top=(window.innerHeight+50)+'px'; setTimeout(()=>{ document.getElementById('overInfo').textContent=`🏢 ${score}층 도달 | ⏱ ${elapsed.toFixed(1)}초`; document.getElementById('overOverlay').classList.add('active'); },700); }
function gameClear(){ gameActive=false; sfxClear(); stopBGM(); if(timerInterval)clearInterval(timerInterval); document.getElementById('clearInfo').textContent=`🏢 150층 완료! | ⏱ ${elapsed.toFixed(1)}초`; document.getElementById('clearOverlay').classList.add('active'); }
function restartGame(){ ['clearOverlay','overOverlay','rankScreen'].forEach(id=>document.getElementById(id).classList.remove('active')); initGameState(); startBGM(); }
function goTitle(){ gameActive=false; stopBGM(); ['clearOverlay','overOverlay','rankScreen'].forEach(id=>document.getElementById(id).classList.remove('active')); document.getElementById('game-view').classList.remove('active'); document.getElementById('titleScreen').classList.remove('hidden'); }
function createHeavenGate(){ const ts=steps[150]||steps[steps.length-1]; heavenGateEl=document.createElement('div'); heavenGateEl.className='heaven-gate'; heavenGateEl.style.left=(ts.x-100)+'px'; heavenGateEl.style.top=(ts.y-140)+'px'; heavenGateEl.innerHTML='<div class="gate-glow">🕊️</div><div class="gate-text">천국의 문</div>'; world.appendChild(heavenGateEl); }
function ensureAudio(){ if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function playTone(f,d,t,v){ ensureAudio(); const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type=t||'square'; o.frequency.value=f; g.gain.value=v||.08; g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+d); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d); }
function sfxJump(){ playTone(520,.1,'square',.07); }
function sfxTurn(){ playTone(440,.08,'triangle',.06); }
function sfxFail(){ playTone(200,.3,'sawtooth',.1); }
function sfxClear(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.3,'square',.08),i*120)); }
function startBGM(){ ensureAudio(); bgmInterval=setInterval(()=>{ if(!gameActive){clearInterval(bgmInterval); return;} playTone(262,.25,'triangle',.02); },500); }
function stopBGM(){ if(bgmInterval)clearInterval(bgmInterval); }
(function(){ const bt=document.getElementById('btnTurn'), bf=document.getElementById('btnForward'); bt.onclick=()=>handleInput('turn'); bf.onclick=()=>handleInput('forward'); })();
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a')handleInput('turn'); else if(e.key==='ArrowRight'||e.key==='d'||e.key==='ArrowUp'||e.key==='w')handleInput('forward'); });
</script>
