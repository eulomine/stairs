<script>
/* ================================================================
   1. ONLINE RANKING SYSTEM (Firebase) - 성도님 DB 주소 적용
   ================================================================ */
const firebaseConfig = {
    apiKey: "AIzaSyBNXIu32GPGJjfPlkrZ_WFLsZViMEWJvY4",
    authDomain: "moohan-2380a.firebaseapp.com",
    databaseURL: "https://moohan-2380a-default-rtdb.firebaseio.com",
    projectId: "moohan-2380a",
    storageBucket: "moohan-2380a.appspot.com",
    messagingSenderId: "207937743460",
    appId: "1:207937743460:web:3525258796e32d61b90d71"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 온라인에서 데이터 불러오기
function renderRank(mode) {
    const body = document.getElementById('rankBody');
    body.innerHTML = '<p style="text-align:center;color:#ffd740;margin-top:30px;">천국에서 기록을 가져오는 중...</p>';

    db.ref('rankings/' + mode).once('value', (snapshot) => {
        let scores = [];
        snapshot.forEach((child) => {
            let d = child.val();
            d.id = child.key;
            scores.push(d);
        });

        scores.sort((a, b) => b.floor - a.floor || a.time - b.time);

        if (!scores.length) {
            body.innerHTML = '<p style="text-align:center;color:#999;margin-top:30px;">아직 기록이 없습니다</p>';
            return;
        }

        let html = '<table class="rank-table"><thead><tr><th>#</th><th>이름</th><th>층</th><th>시간</th><th>날짜</th></tr></thead><tbody>';
        scores.slice(0, 10).forEach((s, i) => {
            const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
            const isMine = lastSavedRankInfo && lastSavedRankInfo.id === s.id;
            html += `<tr style="${isMine ? 'background:rgba(255,215,64,.12);font-weight:700;' : ''}"><td>${medal}</td><td>${s.name}</td><td>${s.floor}</td><td>${s.time}s</td><td>${s.date}</td></tr>`;
        });
        html += '</tbody></table>';

        if (lastSavedRankInfo && lastSavedRankInfo.mode === mode) {
            const myRank = scores.findIndex(x => x.id === lastSavedRankInfo.id) + 1;
            html += `<div class="my-rank-box">내 순위 <strong>${myRank}위</strong></div>`;
        }
        body.innerHTML = html;
    });
}

// 온라인에 데이터 저장
function saveAndShow(mode) {
    const isClr = document.getElementById('clearOverlay').classList.contains('active');
    const inp = isClr ? document.getElementById('clearName') : document.getElementById('overName');
    const name = inp.value.trim() || '무명성도';

    const entry = {
        name,
        floor: score,
        time: parseFloat(elapsed.toFixed(1)),
        date: new Date().toLocaleDateString()
    };

    const newRef = db.ref('rankings/' + mode).push();
    newRef.set(entry);
    lastSavedRankInfo = { id: newRef.key, mode: mode };

    inp.value = '';
    document.getElementById('clearOverlay').classList.remove('active');
    document.getElementById('overOverlay').classList.remove('active');
    showRanking(mode);
}

/* ================================================================
   2. ORIGINAL GAME LOGIC (맨 처음 주신 코드 100% 그대로)
   ================================================================ */
const STEP_W=55,STEP_DY=48,STEP_RENDER_W=80,STEP_RENDER_H=28;
const PLAYER_W=120,PLAYER_H=150,CHAR_VISUAL_OFFSET=20;
const BTN_HEIGHT=130,AHEAD_COUNT=6,INPUT_COOLDOWN=150;
const BG_URLS=['https://i.postimg.cc/sfnhQdQF/1.jpg','https://i.postimg.cc/qBm3hVt5/2.jpg','https://i.postimg.cc/NGNH9qyn/3.jpg','https://i.postimg.cc/zDdgbZL2/4.jpg','https://i.postimg.cc/sfnhQdB0/5.jpg'];
const charDefs={

  elder:{name:'장로님',idle:'https://i.postimg.cc/g0PXFG5w/jang1.png',step:'https://i.postimg.cc/Xv0GSnhJ/jang2.png',fall:'https://i.postimg.cc/R0z65v80/jang3.png'},
  boy:{name:'신광이',idle:'https://i.postimg.cc/Z5NBMWfW/boy1.png',step:'https://i.postimg.cc/4xc7SY8m/boy2.png',fall:'https://i.postimg.cc/cJNgydjL/boy3.png'},
  girl:{name:'새빛이',idle:'https://i.postimg.cc/nhmjPXdr/girl1.png',step:'https://i.postimg.cc/3xG4ckLy/girl2.png',fall:'https://i.postimg.cc/3wH4536r/girl3.png'}
};
const storyMessages=[{floor:1,text:'교회에서 첫 발을 내딛습니다.',verse:'히브리서 11:1'},{floor:15,text:'새벽기도의 시간…',verse:'시편 119:105'},{floor:30,text:'시련의 바다...',verse:'이사야 43:2'},{floor:50,text:'믿음을 지킵니다.',verse:'마태복음 14:31'},{floor:145,text:'영광의 문 앞에!',verse:'요한계시록 21:4'}];

let gameMode='story',selectedChar='pastor',gameActive=false;
let score=0,combo=0,maxCombo=0,steps=[],moveDir=1,playerDir=1,timerStart=0,timerInterval=null,elapsed=0,currentBgIdx=-1,heavenGateEl=null,lastInputTime=0,storyPopupTimer=null,bgTransitioning=false,activeBgLayer='A',lastSavedRankInfo=null;

const world=document.getElementById('world'),player=document.getElementById('player'),bgA=document.getElementById('bgA'),bgB=document.getElementById('bgB'),cloudOverlay=document.getElementById('cloudOverlay'),bgLabel=document.getElementById('bgLabel'),hudFloor=document.getElementById('hudFloor'),hudTime=document.getElementById('hudTime'),progressFill=document.getElementById('progressFill'),comboPopup=document.getElementById('comboPopup'),storyPopupEl=document.getElementById('storyPopup');

const imageCache={};
function cacheImageAsDataURL(url){ return new Promise(resolve=>{ const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>{ try{ const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight; c.getContext('2d').drawImage(img,0,0); imageCache[url]=c.toDataURL('image/png'); }catch(e){ imageCache[url]=url; } resolve(); }; img.onerror=()=>{ imageCache[url]=url; resolve(); }; img.src=url; }); }
function cached(url){return imageCache[url]||url;}

async function preloadAllAssets(onProgress,onDone){ const charUrls=[]; Object.values(charDefs).forEach(c=>{charUrls.push(c.idle,c.step,c.fall);}); const allUrls=[...charUrls,...BG_URLS]; const total=allUrls.length; let loaded=0; const loadText=document.getElementById('loadText'); const promises=allUrls.map((url,i)=>{ return new Promise(resolve=>{ if(i<charUrls.length){ cacheImageAsDataURL(url).then(()=>{ loaded++; onProgress(loaded,total); loadText.textContent=`${loaded}/${total}`; resolve(); }); }else{ const img=new Image(); img.crossOrigin='anonymous'; const done=()=>{ loaded++; onProgress(loaded,total); loadText.textContent=`${loaded}/${total}`; resolve(); }; img.onload=done; img.onerror=done; img.src=url; } }); }); await Promise.all(promises); if(onDone)onDone(); }
window.addEventListener('load',()=>{ preloadAllAssets((ld,tot)=>{document.getElementById('loadFill').style.width=Math.round(ld/tot*100)+'%';},()=>{ setTimeout(()=>{ document.getElementById('loadScreen').classList.add('hidden'); document.getElementById('titleScreen').classList.remove('hidden'); buildCharSelect(); },400); }); });

(function setupButtons(){ const bt=document.getElementById('btnTurn'), bf=document.getElementById('btnForward'); bt.onclick=()=>handleInput('turn'); bf.onclick=()=>handleInput('forward'); })();
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key==='a')handleInput('turn'); else if(e.key==='ArrowRight'||e.key==='d'||e.key==='ArrowUp'||e.key==='w')handleInput('forward'); });

function buildCharSelect(){ const area=document.getElementById('charSelectArea'); area.innerHTML=''; const wrap=document.createElement('div'); wrap.className='char-select'; Object.entries(charDefs).forEach(([key,def])=>{ const btn=document.createElement('button'); btn.className='char-btn'+(key===selectedChar?' selected':''); btn.innerHTML=`<img src="${cached(def.idle)}"><span>${def.name}</span>`; btn.onclick=()=>{ selectedChar=key; wrap.querySelectorAll('.char-btn').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); }; wrap.appendChild(btn); }); area.appendChild(wrap); }
function selectMode(mode){ gameMode=mode; startGame(); }
function getBgPhase(floor){ const maxF=(gameMode==='story')?150:250; const p=Math.min(floor/maxF,1); if(p<.20)return{idx:0,label:'⛪ 교회'}; if(p<.40)return{idx:1,label:'🌊 시련의 바다'}; if(p<.60)return{idx:2,label:'🏜️ 광야'}; if(p<.80)return{idx:3,label:'🔥 연단의 불'}; return{idx:4,label:'✨ 천국'}; }
function transitionBg(idx){ if(bgTransitioning)return; bgTransitioning=true; const inc=(activeBgLayer==='A')?bgB:bgA, out=(activeBgLayer==='A')?bgA:bgB; inc.style.backgroundImage=`url('${BG_URLS[idx]}')`; inc.style.opacity='1'; cloudOverlay.classList.add('active'); setTimeout(()=>{ out.style.opacity='0'; activeBgLayer=(activeBgLayer==='A')?'B':'A'; },600); setTimeout(()=>{ cloudOverlay.classList.remove('active'); bgTransitioning=false; },1200); }
function updateBg(floor){ const p=getBgPhase(floor); if(p.idx!==currentBgIdx){ if(currentBgIdx===-1){ bgA.style.backgroundImage=`url('${BG_URLS[p.idx]}')`; bgA.style.opacity='1'; activeBgLayer='A'; }else{ transitionBg(p.idx); } currentBgIdx=p.idx; } bgLabel.textContent=p.label; bgLabel.style.opacity='1'; setTimeout(()=>{bgLabel.style.opacity='0';},2000); }

let audioCtx=null,bgmInterval=null;
function initAudio(){ if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume(); }
function playTone(freq,dur,type,vol){ if(!audioCtx)return; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type=type||'square'; o.frequency.value=freq; g.gain.value=vol||.05; g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur); }
const sfxJump=()=>{playTone(520,.1,'square',.07);setTimeout(()=>playTone(680,.08,'square',.05),50);},sfxTurn=()=>{playTone(440,.08,'triangle',.06);setTimeout(()=>playTone(580,.1,'triangle',.05),40);},sfxFail=()=>{playTone(200,.3,'sawtooth',.1);setTimeout(()=>playTone(150,.4,'sawtooth',.08),150);},sfxClear=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.3,'square',.08),i*120));
function startBGM(){ if(bgmInterval)clearInterval(bgmInterval); const n=[262,330,392,523,392,330,262,330,392,523,659,523,392,330]; let i=0; bgmInterval=setInterval(()=>{if(gameActive&&audioCtx){playTone(n[i%n.length],.2,'triangle',.02);i++;}},500); }

function addNewStep(){ const prev=steps[steps.length-1],dir=Math.random()<.5?-1:1; const s={x:prev.x+dir*STEP_W,y:prev.y-STEP_DY,dir:dir,type:'normal',floor:steps.length,el:null}; steps.push(s); renderStep(s); }
function renderStep(s){ const div=document.createElement('div'); div.className='step step-normal'; div.style.width=STEP_RENDER_W+'px'; div.style.height=STEP_RENDER_H+'px'; div.style.left=(s.x-STEP_RENDER_W/2)+'px'; div.style.top=s.y+'px'; world.appendChild(div); s.el=div; }
function startGame(){ document.getElementById('titleScreen').classList.add('hidden'); document.getElementById('game-view').classList.add('active'); document.getElementById('hud').classList.add('active'); document.getElementById('buttons').classList.add('active'); initGameState(); startBGM(); }
function initGameState(){ initAudio(); gameActive=true; score=0; combo=0; moveDir=1; playerDir=1; elapsed=0; steps=[]; world.innerHTML=''; steps.push({x:window.innerWidth/2,y:1000,dir:0}); renderStep(steps[0]); for(let i=0;i<160;i++)addNewStep(); player.src=cached(charDefs[selectedChar].idle); player.style.width=PLAYER_W+'px'; player.style.height=PLAYER_H+'px'; player.style.left=(window.innerWidth/2-PLAYER_W/2)+'px'; player.style.top=(window.innerHeight-BTN_HEIGHT-40-PLAYER_H+20)+'px'; updateCamera(); updateBg(0); updateHUD(); timerStart=Date.now(); timerInterval=setInterval(()=>{if(gameActive){elapsed=(Date.now()-timerStart)/1000;hudTime.textContent='⏱ '+elapsed.toFixed(1)+'s';}},100); }
function updateCamera(){ const cur=steps[score]; world.style.transform=`translate(${window.innerWidth/2-cur.x}px,${window.innerHeight-BTN_HEIGHT-40-cur.y}px)`; }
function updateHUD(){ hudFloor.textContent='🏢 '+score+'층'; if(gameMode==='story')progressFill.style.width=(score/150*100)+'%'; }
function handleInput(action){ if(!gameActive)return; const next=steps[score+1]; let inputDir=moveDir; if(action==='turn'){ moveDir*=-1; playerDir=moveDir; inputDir=moveDir; sfxTurn(); }else{ sfxJump(); } if(inputDir===next.dir){ score++; player.style.transform=`scaleX(${playerDir})`; player.src=cached(charDefs[selectedChar].step); updateCamera(); updateBg(score); updateHUD(); if(score===150&&gameMode==='story')gameClear(); setTimeout(()=>{if(gameActive)player.src=cached(charDefs[selectedChar].idle);},80); }else{ gameOver(); } }
function gameOver(){ gameActive=false; sfxFail(); player.src=cached(charDefs[selectedChar].fall); clearInterval(timerInterval); document.getElementById('overOverlay').classList.add('active'); }
function gameClear(){ gameActive=false; sfxClear(); clearInterval(timerInterval); document.getElementById('clearOverlay').classList.add('active'); }
function restartGame(){ ['clearOverlay','overOverlay','rankScreen'].forEach(id=>document.getElementById(id).classList.remove('active')); initGameState(); }
function goTitle(){ location.reload(); }
function showRanking(mode){ document.getElementById('rankScreen').classList.add('active'); switchRankTab(mode||'story', document.querySelectorAll('.rank-tab')[mode==='infinite'?1:0]); }
function switchRankTab(mode,btn){ document.querySelectorAll('.rank-tab').forEach(t=>t.classList.remove('active')); btn.classList.add('active'); renderRank(mode); }
function closeRanking(){ document.getElementById('rankScreen').classList.remove('active'); goTitle(); }
function showStoryPopup(t,v){ document.getElementById('storyText').textContent=t; document.getElementById('storyVerse').textContent=v; storyPopupEl.classList.add('show'); setTimeout(()=>storyPopupEl.classList.remove('show'),3000); }
</script>
